services:
  api:
    build:
      context: .
      target: runtime
    command: ["/bin/api"]
    ports:
      - "8089:8080"

  bot:
    build:
      context: .
      target: runtime
    command: ["/bin/bot"]

  db:
    image: postgres:16
    container_name: go_db
    restart: always
    ports:
      - "8432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: my-redis
    ports:
      - "6379:6379"  # наружу, чтобы можно было подключаться с хоста
    volumes:
      - redis_data:/data  # сохраняем данные между перезапусками
    command: ["redis-server", "--appendonly", "yes"] # включаем AOF для надежности

volumes:
  db_data:
  redis_data:
